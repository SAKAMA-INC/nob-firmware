# Run code formatting

name: Artistic Style

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# テスト/静的検査のみでキャンセルしても副作用がないため、後発の実行を優先して
# 先行分はキャンセルする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This workflow contains a single job called "unit-test"
  astyle:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # 8月の実行実績が無く実測が取れないため、指示書 A-3 の目安値（lint / typecheck = 10分）を採用。
    # 既定の360分のままだと、ハング1回で360分を消費する。
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v2

    # Install Artistic Style
    - name: Install Astyle
      run: |
          wget -q https://sourceforge.net/projects/astyle/files/astyle/astyle%203.1/astyle_3.1_linux.tar.gz/download -O astyle.tar.gz
          tar -xvf astyle.tar.gz
          cd astyle
          mkdir as-gcc-exe
          cd as-gcc-exe
          cmake  ../
          make
          sudo make install
          cd ../../

    # Run Artistic Style
    - name: Run Astyle
      run: make astyle
        
    # Check output
    - name: Check formatting
      run: git diff --exit-code --diff-filter=d --color
